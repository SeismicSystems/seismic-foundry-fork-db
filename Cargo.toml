[package]
name = "foundry-fork-db"
description = "Fork database used by Foundry"
version = "0.18.0"
edition = "2021"
# Remember to update clippy.toml as well
rust-version = "1.88"
authors = ["Foundry Contributors", "Seismic Systems"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/SeismicSystems/seismic-foundry-fork-db"
repository = "https://github.com/SeismicSystems/seismic-foundry-fork-db"

[lints]
rust.unused_must_use = "deny"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rustdoc.all = "warn"

[lints.clippy]
missing_const_for_fn = "allow" # TODO: https://github.com/rust-lang/rust-clippy/issues/14020
use_self = "warn"
option_if_let_else = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
seismic-prelude = "0.0.1"
alloy-chains = { version = "0.2", default-features = false, features = ["serde"] }
alloy-consensus = { version = "1.0.25", default-features = false }
alloy-hardforks = { version = "0.2.13", default-features = false }
alloy-primitives = { version = "1.3", features = ["map"] }
alloy-provider = { version = "1.0.25", default-features = false }
alloy-rpc-types = { version = "1.0.25", features = ["eth"] }

eyre = "0.6"
futures = "0.3"

parking_lot = "0.12"

revm = { version = "29.0.0", features = ["std", "serde"] }

serde = "1.0"
serde_json = "1.0"

thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"

url = "2"

[dev-dependencies]
alloy-rpc-client = "1.0.25"
tiny_http = "0.12"

[patch.crates-io]
# seismic-foundry
seismic-enclave = { git = "https://github.com/SeismicSystems/enclave.git", branch = "seismic" }

# seismic-alloy-core
alloy-dyn-abi = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", branch = "usm" }
alloy-json-abi = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", branch = "usm" }
alloy-primitives = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", branch = "usm" }
alloy-sol-macro = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", branch = "usm" }
alloy-sol-macro-expander = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", branch = "usm" }
alloy-sol-macro-input = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", branch = "usm" }
alloy-sol-types = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", branch = "usm" }
alloy-sol-type-parser = { git = "https://github.com/SeismicSystems/seismic-alloy-core.git", branch = "usm" }

alloy-trie = { git = "https://github.com/SeismicSystems/seismic-trie.git", branch = "usm" }

# seismic-revm
revm = { git = "https://github.com/SeismicSystems/seismic-revm.git", branch = "usm" }
seismic-revm = { git = "https://github.com/SeismicSystems/seismic-revm.git", branch = "usm"}

# seismic-alloy
seismic-prelude = { git = "https://github.com/SeismicSystems/seismic-alloy.git", branch = "usm" }
